name: Build conference feed

on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 heures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        run: |
          python build_feed.py \
            --feed-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.xml"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json feed.xml
          git diff --cached --quiet || (git commit -m "Update feed" && git push)
